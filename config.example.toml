# HippoRoute-Jev-Codex configuration (Python 3.11+; no third-party packages).
# Copy to config.local.toml. The local file is ignored by Git.

[server]
# Keep this on a loopback address: the HTTP API has no local authentication.
host = "127.0.0.1"
port = 4319
# Reject oversized request bodies, idle clients, and excess concurrent POSTs.
max_request_body_bytes = 16777216
client_socket_timeout_seconds = 30
max_concurrent_requests = 64

[upstream]
# direct: ChatGPT Codex backend, using Codex's subscription Authorization header.
# caller_edge: Codex Router's shared-session endpoint.
mode = "direct"
direct_url = "https://chatgpt.com/backend-api/codex"
caller_edge_url = "http://127.0.0.1:4202"
# Created by `codex-router chatgpt-session enable`; content is never copied here.
caller_secret_path = "~/.codex/codex-router/caller-secret"
timeout_seconds = 900

[paths]
# Runtime files can contain thread identifiers and prompt-derived previews.
state = "~/.codex/hipporoute/threads.json"
decision_log = "~/.codex/hipporoute/decisions.jsonl"
off = "~/.codex/hipporoute/router.off"
shadow = "~/.codex/hipporoute/router.shadow"
stream_debug = "~/.codex/hipporoute/stream.debug"
raw_stream_dir = "~/.codex/hipporoute/raw-streams"

[jev]
# Key order: TYPESAFE_API_KEY env, this optional key_file, then ~/.jev.env.
# The file contains one line: TYPESAFE_API_KEY=your_key
# Literal key/api_key/typesafe_api_key fields are rejected.
# key_file = "~/.config/hipporoute/jev.env"
url = "https://api.typesafe.ai/v1/systemone"
model = "jev-latest"
timeout_seconds = 4
retries = 2
backoff_seconds = 0.25
retry_after_cap_seconds = 4
circuit_failure_threshold = 3
circuit_open_seconds = 60
confidence_gate = 0.5

[routing]
downgrade_max_context_tokens = 20000
switch_budget_usd = 0.25
chars_per_token = 2.8
# Allowed: low, medium, high, xhigh, max. Benchmarked default is low.
luna_effort = "low"
state_ttl_seconds = 86400
state_gc_interval_seconds = 300
state_flush_interval_seconds = 2
summary_marker = false

# USD per million tokens. Update when upstream pricing changes.
[prices."gpt-6-astra"]
input = 10.00
cached_input = 1.00
output = 50.00
cache_write = 12.50

[prices."gpt-5.6-sol"]
input = 4.00
cached_input = 0.40
output = 20.00
cache_write = 5.00

[prices."gpt-5.6-luna"]
input = 0.20
cached_input = 0.02
output = 1.20
cache_write = 0.25
