[server]
host = "127.0.0.1"
port = 4319

[upstream]
# "direct" uses the ChatGPT Codex backend and honors HTTPS_PROXY.
# "caller_edge" uses Codex Router's local shared-session endpoint.
mode = "direct"
direct_url = "https://chatgpt.com/backend-api/codex"
caller_edge_url = "http://127.0.0.1:4202"
caller_secret_path = "~/.codex/codex-router/caller-secret"
timeout_seconds = 900

[paths]
state = "~/.codex/codex-jev-router/threads.json"
decision_log = "~/.codex/codex-jev-router/decisions.jsonl"
off = "~/.codex/codex-jev-router/router.off"
shadow = "~/.codex/codex-jev-router/router.shadow"

[jev]
url = "https://api.typesafe.ai/v1/systemone"
model = "jev-latest"
timeout_seconds = 4
retries = 2
backoff_seconds = 0.25
confidence_gate = 0.5

[routing]
downgrade_max_context_tokens = 20000
switch_budget_usd = 0.25
chars_per_token = 2.8
summary_marker = false

[prices."gpt-6-astra"]
input = 10.00
cached_input = 1.00
output = 50.00
cache_write = 12.50

[prices."gpt-5.6-sol"]
input = 4.00
cached_input = 0.40
output = 20.00
cache_write = 5.00

[prices."gpt-5.6-luna"]
input = 0.20
cached_input = 0.02
output = 1.20
cache_write = 0.25
