# Copy this file to config.service.toml before installing the launchd service.
# This example uses Codex Router's caller edge and contains no credentials.
[server]
host = "127.0.0.1"
port = 4319
max_request_body_bytes = 16777216
client_socket_timeout_seconds = 30
max_concurrent_requests = 64

[upstream]
mode = "caller_edge"
direct_url = "https://chatgpt.com/backend-api/codex"
caller_edge_url = "http://127.0.0.1:4202"
caller_secret_path = "~/.codex/codex-router/caller-secret"
timeout_seconds = 900

[paths]
state = "~/.codex/codex-jev-router/threads.json"
decision_log = "~/.codex/codex-jev-router/decisions.jsonl"
off = "~/.codex/codex-jev-router/router.off"
shadow = "~/.codex/codex-jev-router/router.shadow"
stream_debug = "~/.codex/codex-jev-router/stream.debug"
raw_stream_dir = "~/.codex/codex-jev-router/raw-streams"

[jev]
# Optional third key source after TYPESAFE_API_KEY and before ~/.jev.env.
# key_file = "~/.config/codex-jev-router/jev.env"
url = "https://api.typesafe.ai/v1/systemone"
model = "jev-latest"
timeout_seconds = 4
retries = 2
backoff_seconds = 0.25
retry_after_cap_seconds = 4
circuit_failure_threshold = 3
circuit_open_seconds = 60
confidence_gate = 0.5

[routing]
downgrade_max_context_tokens = 20000
switch_budget_usd = 0.25
chars_per_token = 2.8
luna_effort = "low"
state_ttl_seconds = 86400
state_gc_interval_seconds = 300
state_flush_interval_seconds = 2
summary_marker = false

[prices."gpt-6-astra"]
input = 10.00
cached_input = 1.00
output = 50.00
cache_write = 12.50

[prices."gpt-5.6-sol"]
input = 4.00
cached_input = 0.40
output = 20.00
cache_write = 5.00

[prices."gpt-5.6-luna"]
input = 0.20
cached_input = 0.02
output = 1.20
cache_write = 0.25
